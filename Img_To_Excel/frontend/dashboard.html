<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · Image2Excel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body onload="requireAuth()">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2"><a class="navbar-brand" href="dashboard.html"><span
                    class="brand-mark">↗</span>Image<span class="text-brand">2Excel</span></a>
            <div class="ms-auto d-flex gap-2"><a class="btn btn-light" href="history.html">History</a><button
                    class="btn btn-outline-dark" onclick="logout()">Log out</button></div>
        </div>
    </nav>
    <main class="container page-header">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <p class="text-brand fw-semibold mb-2">DASHBOARD</p>
                <h1 class="fw-bold mb-1">Your workspace</h1>
                <p class="text-secondary mb-0">Convert your documents into useful data.</p>
            </div><a class="btn btn-brand" href="upload.html">+ Upload document</a>
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card feature-card p-4"><small class="text-secondary">Quick start</small>
                    <h4 class="mt-2">Upload a table</h4>
                    <p class="text-secondary">Use JPG, PNG, WEBP, or PDF files.</p><a href="upload.html"
                        class="btn btn-outline-primary">Choose file</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card feature-card p-4"><small class="text-secondary">Your documents</small>
                    <h4 class="mt-2">Browse history</h4>
                    <p class="text-secondary">Review everything you have uploaded.</p><a href="history.html"
                        class="btn btn-outline-primary">View history</a>
                </div>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
