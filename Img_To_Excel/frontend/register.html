<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Image2Excel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><nav class="navbar bg-white border-bottom"><div class="container py-2"><a class="navbar-brand" href="index.html"><span class="brand-mark">↗</span>Image<span class="text-brand">2Excel</span></a></div></nav>
<main class="auth-shell"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card auth-card p-4 p-md-5"><h2 class="fw-bold">Create your account</h2><p class="text-secondary mb-4">Start converting documents in seconds.</p><div id="pageMessage"></div><form onsubmit="submitRegister(event)"><div class="mb-3"><label class="form-label">Name</label><input class="form-control form-control-lg" type="text" name="name" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control form-control-lg" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" minlength="8" required></div><div class="mb-4"><label class="form-label">Confirm password</label><input class="form-control form-control-lg" type="password" name="confirm_password" minlength="8" required></div><button class="btn btn-brand btn-lg w-100">Create account</button></form><p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="login.html">Log in</a></p></div></div></div></div></main>
<script src="js/app.js"></script></body></html>
