<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload document · Image2Excel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body onload="requireAuth()"><nav class="navbar bg-white border-bottom"><div class="container py-2"><a class="navbar-brand" href="dashboard.html"><span class="brand-mark">↗</span>Image<span class="text-brand">2Excel</span></a><div class="ms-auto d-flex gap-2"><a class="btn btn-light" href="history.html">History</a><button class="btn btn-outline-dark" onclick="logout()">Log out</button></div></div></nav>
