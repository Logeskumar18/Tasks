<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Document history · Image2Excel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body onload="loadDocuments()"><nav class="navbar bg-white border-bottom"><div class="container py-2"><a class="navbar-brand" href="dashboard.html"><span class="brand-mark">↗</span>Image<span class="text-brand">2Excel</span></a><div class="ms-auto d-flex gap-2"><a class="btn btn-brand" href="upload.html">+ Upload</a><button class="btn btn-outline-dark" onclick="logout()">Log out</button></div></div></nav>
<main class="container page-header"><div class="d-flex justify-content-between align-items-end mb-4"><div><p class="text-brand fw-semibold mb-2">DOCUMENTS</p><h1 class="fw-bold mb-1">History</h1><p class="text-secondary mb-0"><span id="documentCount">0</span> uploaded documents</p></div></div><div id="pageMessage"></div><div class="card feature-card overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Filename</th><th>Type</th><th>Status</th><th>Uploaded</th><th class="text-end">Actions</th></tr></thead><tbody id="documentsBody"><tr><td colspan="5"><div class="empty-state">Loading documents...</div></td></tr></tbody></table></div></div></main>
<div class="modal fade" id="tableViewModal" tabindex="-1" aria-labelledby="tableViewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tableViewModalLabel">Extracted data</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="tableViewContent"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
